[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-meeting_notes_env"
version = "2.0.0"
description = "Meeting Notes Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "requests>=2.25.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m meeting_notes_env.server.app
server = "meeting_notes_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["meeting_notes_env", "meeting_notes_env.server"]
package-dir = { "meeting_notes_env" = ".", "meeting_notes_env.server" = "server" }